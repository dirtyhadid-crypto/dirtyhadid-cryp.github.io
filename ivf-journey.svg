  <circle class="dot" cx="380" cy="285" r="7"/>
  <circle class="dot" cx="535" cy="285" r="7"/>
  <circle class="dot" cx="595" cy="380" r="7"/>
  <circle class="dot" cx="760" cy="380" r="7"/>
  <circle class="dot" cx="820" cy="255" r="7"/>
  <circle class="dot" cx="1020" cy="255" r="7"/>

  <g transform="translate(56 150)">
