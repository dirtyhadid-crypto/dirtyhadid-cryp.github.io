<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 620">
  <defs>
    <style>
      .bg { fill: #efe2cc; }
      .card { fill: rgba(255,255,255,0.45); stroke: #171310; stroke-width: 2.4; rx: 26; }
      .node { fill: #171310; }
      .dot { fill: #171310; }
      .line { stroke: #171310; stroke-width: 3; stroke-linecap: round; fill: none; }
      .thin { stroke: rgba(23,19,16,0.46); stroke-width: 1.7; stroke-linecap: round; fill: none; }
      .title { font-family: "Hiragino Rounded GB","SF Pro Rounded","YouYuan","PingFang SC",sans-serif; font-size: 30px; font-weight: 700; fill: #171310; }
      .label { font-family: "Hiragino Rounded GB","SF Pro Rounded","YouYuan","PingFang SC",sans-serif; font-size: 18px; font-weight: 700; fill: #171310; }
      .small { font-family: "Hiragino Rounded GB","SF Pro Rounded","YouYuan","PingFang SC",sans-serif; font-size: 14px; font-weight: 700; fill: rgba(23,19,16,0.72); }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1180" height="620" rx="36"/>
  <rect class="card" x="24" y="24" width="1132" height="572" rx="34"/>

  <text x="70" y="84" class="title">试管流程总览</text>
